services:
  - type: web
    name: adaptive-ascent-server
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adaptive-ascent-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: adaptive-ascent-db
    plan: free
